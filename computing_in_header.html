<style>
#computing-icon {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 2000;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #ffffff;
  border-radius: 4px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  font-size: 14px;
  color: #333333;
}
#computing-icon.active {
  display: flex;
}
#computing-icon .spinner {
  width: 18px;
  height: 18px;
  border: 3px solid #d6e6f7;
  border-top-color: #0275D8;
  border-radius: 50%;
  animation: computing-spin 0.8s linear infinite;
}
@keyframes computing-spin {
  to { transform: rotate(360deg); }
}
</style>
<script>
  // computing icon, shown when a map selection is made or changed, or when
  // inputs that recompute selection results change after a selection exists
  // the icon is shown on the first server busy event after the input change
  // and hidden on the following idle event, a stale idle event can arrive
  // right after the input change and would otherwise hide it immediately
  $(function() {

    var icon = $('<div id="computing-icon"><div class="spinner"></div><span>Computing...</span></div>');
    $('body').append(icon);

    var drawinp = /^editor-map_draw_(new_feature|edited_features|deleted_features)$/;
    var selinp = ['flsel', 'yrcmp1', 'yrcmp2', 'nodpd'];
    var hassel = false;
    var pending = false;

    $(document).on('shiny:inputchanged', function(event) {
      if (drawinp.test(event.name)) {
        hassel = true;
        pending = true;
      } else if (hassel && selinp.indexOf(event.name) > -1) {
        pending = true;
      }
    });

    $(document).on('shiny:busy', function() {
      if (pending) {
        pending = false;
        icon.addClass('active');
      }
    });

    $(document).on('shiny:idle', function() {
      if (!pending) {
        icon.removeClass('active');
      }
    });

  });
</script>
